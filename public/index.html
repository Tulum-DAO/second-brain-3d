<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain — live VPS infrastructure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://esm.sh/three@0.183.2","three/":"https://esm.sh/three@0.183.2/"}}
</script>
<style>
  :root{
    --bg:#1E1A17; --bg-2:#14110f; --cream:#EDE4D3; --amber:#E8A225;
    --muted:#8A7F6E; --line:rgba(237,228,211,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--cream);
    font-family:'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-font-smoothing:antialiased}
  #brain-graph{position:fixed;inset:0;z-index:0}
  #pulse-labels{position:fixed;inset:0;z-index:6;pointer-events:none}
  .orbit-hint{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:11;pointer-events:none;
    font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:5px 12px;border-radius:6px;background:rgba(10,8,6,.85);border:1px solid var(--line);
    opacity:0;transition:opacity .25s}
  .orbit-hint.on{opacity:1}
  .orbit-hint.warn{color:#ef4444;border-color:rgba(239,68,68,.4)}
  .orbit-hint.ok{color:var(--amber);border-color:rgba(232,162,37,.35)}
  .plabel{position:absolute;transform:translate(-50%,-140%);font-family:'Azeret Mono',monospace;
    font-size:9px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
    padding:2px 6px;border-radius:4px;background:rgba(10,8,6,.82);border:1px solid rgba(237,228,211,.14);
    text-shadow:0 0 6px currentColor;will-change:transform,left,top}

  /* retro overlays */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:5}
  .fx.vignette{background:radial-gradient(120% 120% at 50% 38%,transparent 46%,rgba(0,0,0,.55) 100%)}
  .fx.scanlines{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply;opacity:.45}
  .fx.grain{opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .fx.flicker{background:var(--amber);opacity:0;mix-blend-mode:overlay;animation:flick 6s steps(60) infinite}
  @keyframes flick{0%,97%,100%{opacity:0}98%{opacity:.015}99%{opacity:.03}}

  .ui{position:fixed;z-index:10;pointer-events:none}
  .topbar{top:26px;left:30px}
  .eyebrow{font-size:10px;letter-spacing:.42em;color:var(--amber);text-transform:uppercase;opacity:.9;margin-bottom:10px}
  .eyebrow .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;margin-right:8px;vertical-align:middle;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:.4}50%{opacity:1}}
  .title{font-size:clamp(24px,4vw,46px);font-weight:600;letter-spacing:.04em;line-height:.98;text-transform:uppercase;text-shadow:0 0 26px rgba(232,162,37,.28)}
  .title .b{color:var(--amber)}
  .subtitle{margin-top:12px;font-size:12px;color:var(--muted);letter-spacing:.16em}
  .subtitle b{color:var(--cream);font-weight:500}
  .orbit-btn{margin-top:14px;pointer-events:auto;display:inline-flex;align-items:center;gap:8px;
    background:transparent;border:1px solid var(--line);color:var(--cream);font-family:inherit;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .15s}
  .orbit-btn:hover{border-color:var(--amber);color:var(--amber)}
  .orbit-btn.on{background:var(--amber);color:#0e0c0a;border-color:var(--amber)}
  .orbit-btn .oi{width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%;position:relative;flex:0 0 auto}
  .orbit-btn .oi::after{content:'';position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;top:-2px;left:2px}
  .orbit-btn.on .oi{animation:orbspin 3s linear infinite}
  @keyframes orbspin{to{transform:rotate(360deg)}}

  /* search */
  .searchwrap{top:26px;left:50%;transform:translateX(-50%);pointer-events:auto}
  .searchwrap input{width:min(46vw,420px);background:rgba(20,17,15,.82);border:1px solid var(--line);
    color:var(--cream);font-family:inherit;font-size:12px;letter-spacing:.14em;padding:10px 14px;border-radius:8px;outline:none}
  .searchwrap input:focus{border-color:var(--amber);box-shadow:0 0 18px rgba(232,162,37,.18)}
  .searchres{margin-top:6px;max-height:40vh;overflow:auto;background:rgba(20,17,15,.94);border:1px solid var(--line);border-radius:8px;display:none}
  .searchres.on{display:block}
  .searchres .r{padding:7px 13px;font-size:11px;letter-spacing:.08em;cursor:pointer;border-bottom:1px solid rgba(237,228,211,.05);color:var(--muted)}
  .searchres .r:hover{background:rgba(232,162,37,.1);color:var(--cream)}
  .searchres .r .c{font-size:9px;opacity:.6;float:right;text-transform:uppercase;letter-spacing:.2em}

  .readout{top:30px;right:30px;text-align:right;min-height:34px}
  .readout .rk{font-size:9px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  .readout .rv{font-size:15px;letter-spacing:.02em;color:var(--cream);margin-top:5px;min-height:20px}
  .readout .rp{font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-top:3px;opacity:.9}

  .legend{bottom:24px;right:26px;pointer-events:auto;text-align:right;max-width:44vw}
  .legend .lg-title{font-size:9px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
  .legend .rows{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
  .lg{display:inline-flex;align-items:center;gap:9px;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px;letter-spacing:.12em;color:var(--muted);border:1px solid transparent;transition:color .18s,background .18s,border-color .18s}
  .lg .sw{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:0 0 auto}
  .lg .ct{font-size:9px;opacity:.5}
  .lg:hover{color:var(--cream);background:rgba(237,228,211,.05)}
  .lg.active{color:#0e0c0a;font-weight:600}
  .lg.dim{opacity:.32}

  .hint{bottom:26px;left:30px;font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;display:flex;gap:14px;align-items:center}
  .hint .k{color:var(--cream)}
  .hint .dot{width:3px;height:3px;border-radius:50%;background:var(--amber);opacity:.6}

  /* detail panel */
  .panel{position:fixed;z-index:12;top:0;left:0;height:100%;width:340px;background:rgba(16,13,11,.94);
    border-right:1px solid var(--line);padding:26px 24px;transform:translateX(-110%);transition:transform .4s cubic-bezier(.4,0,.2,1);
    pointer-events:auto;overflow:auto;backdrop-filter:blur(6px)}
  .panel.on{transform:translateX(0)}
  .panel .pk{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .panel .pt{font-size:20px;font-weight:600;letter-spacing:.02em;margin:8px 0 4px;word-break:break-word}
  .panel .badge{display:inline-block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-right:6px;margin-top:6px}
  .panel .row{margin-top:16px;font-size:11px;letter-spacing:.06em;color:var(--muted);line-height:1.7}
  .panel .row b{color:var(--cream);font-weight:500}
  .panel .row .lbl{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);opacity:.8;display:block;margin-bottom:3px}
  .panel a{color:var(--amber);text-decoration:none;word-break:break-all}
  .panel a:hover{text-decoration:underline}
  .panel .close{position:absolute;top:18px;right:18px;cursor:pointer;color:var(--muted);font-size:16px}
  .panel .close:hover{color:var(--cream)}

  /* ticker */
  .ticker{position:fixed;bottom:44px;left:0;right:0;z-index:8;height:22px;overflow:hidden;
    pointer-events:none;display:flex;align-items:center;padding:0 30px;font-size:10px;letter-spacing:.14em;color:var(--muted)}
  .ticker .ev{white-space:nowrap;opacity:0;animation:tick 4s ease forwards}
  @keyframes tick{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  .ticker .ev .tag{color:var(--amber);margin-right:8px}

  /* time scrubber */
  .scrubber{position:fixed;bottom:0;left:0;right:0;z-index:14;height:44px;display:flex;align-items:center;gap:12px;
    padding:0 24px;background:linear-gradient(to top,rgba(10,8,6,.96),rgba(10,8,6,.72));border-top:1px solid var(--line);pointer-events:auto}
  .scr-btn{background:transparent;border:1px solid var(--line);color:var(--cream);font-family:inherit;font-size:10px;
    letter-spacing:.14em;padding:5px 10px;border-radius:5px;cursor:pointer;transition:all .15s}
  .scr-btn:hover{border-color:var(--amber);color:var(--amber)}
  .scr-btn.on{background:var(--amber);color:#0e0c0a;border-color:var(--amber)}
  #scr-live.live{color:#22c55e;border-color:rgba(34,197,94,.4)}
  .scr-range{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:rgba(237,228,211,.18);outline:none;cursor:pointer}
  .scr-range::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--amber);box-shadow:0 0 10px rgba(232,162,37,.6);cursor:pointer}
  .scr-range::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--amber);cursor:pointer}
  .scr-time{font-size:10px;letter-spacing:.1em;color:var(--muted);min-width:132px;text-align:center;white-space:nowrap}
  .scr-time.replay{color:var(--amber)}
  .scr-win{background:rgba(20,17,15,.9);border:1px solid var(--line);color:var(--cream);font-family:inherit;
    font-size:10px;letter-spacing:.1em;padding:4px 6px;border-radius:5px;cursor:pointer;outline:none}

  /* message inspector panel (right side) */
  .msgpanel{position:fixed;z-index:13;top:0;right:0;height:100%;width:380px;max-width:92vw;background:rgba(14,11,9,.97);
    border-left:1px solid var(--line);padding:24px 22px 60px;transform:translateX(110%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    pointer-events:auto;overflow:auto;backdrop-filter:blur(8px)}
  .msgpanel.on{transform:translateX(0)}
  .msgpanel .mk{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .msgpanel .mt{font-size:15px;font-weight:600;letter-spacing:.02em;margin:8px 0 4px;color:var(--cream);word-break:break-word}
  .msgpanel .mt .arw{color:var(--amber);margin:0 6px}
  .msgpanel .close{position:absolute;top:16px;right:16px;cursor:pointer;color:var(--muted);font-size:16px}
  .msgpanel .close:hover{color:var(--cream)}
  .msg{border:1px solid rgba(237,228,211,.09);border-left-width:2px;border-radius:6px;padding:9px 11px;margin-top:12px;background:rgba(237,228,211,.02)}
  .msg .mh{display:flex;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .msg .mtype{font-weight:600}
  .msg .msub{font-size:12px;color:var(--cream);margin-top:5px;line-height:1.4}
  .msg .mbody{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5;white-space:pre-wrap;max-height:120px;overflow:auto}
  .msg .mdir{font-size:9px;letter-spacing:.08em;color:var(--muted);margin-top:6px}
  .msg .mdir b{color:var(--cream);font-weight:500}

  .loader{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s ease;font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  .loader.gone{opacity:0;pointer-events:none}
  .loader .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* top-right layers menu */
  .layers{top:92px;right:26px;pointer-events:auto;background:rgba(16,13,11,.92);border:1px solid var(--line);
    border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);min-width:174px}
  .layers .lyr-title{font-size:9px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .layers label{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.1em;color:var(--muted);
    text-transform:uppercase;cursor:pointer;padding:3px 0}
  .layers label:hover{color:var(--cream)}
  .layers input[type=checkbox]{appearance:none;-webkit-appearance:none;width:12px;height:12px;border:1px solid var(--line);
    border-radius:3px;cursor:pointer;position:relative;flex:0 0 auto;background:transparent}
  .layers input[type=checkbox]:checked{background:var(--amber);border-color:var(--amber)}
  .layers input[type=checkbox]:checked::after{content:'';position:absolute;left:3px;top:0;width:4px;height:8px;
    border:solid #0e0c0a;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .layers .lyr-slider{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
  .layers .lyr-slabel{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .layers .lyr-slabel span{color:var(--amber)}
  .layers input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    background:rgba(237,228,211,.18);outline:none;cursor:pointer}
  .layers input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--amber);box-shadow:0 0 8px rgba(232,162,37,.6);cursor:pointer}
  .layers input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--amber);cursor:pointer}

  /* collapsible panels (Layers, Legend) — click the header to fold on small screens */
  .panel-head{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;user-select:none}
  .panel-head .caret{font-size:9px;opacity:.6;transition:transform .2s}
  .collapsible.collapsed .panel-body{display:none}
  .collapsible.collapsed .panel-head{margin-bottom:0}
  .collapsible.collapsed .caret{transform:rotate(-90deg)}
  .legend .panel-head{justify-content:flex-end}   /* legend is right-aligned; keep caret after the title */

  body.embed .topbar,body.embed .hint,body.embed .loader,body.embed .subtitle,body.embed .layers{display:none!important}

  /* ---- CONSOLE (/console) — iOS-app surface: strip desktop fluff, finger-first ---- */
  body.console .eyebrow,body.console .subtitle,body.console .hint,body.console .readout,
  body.console .ticker,body.console .loader{display:none!important}
  body.console .title{font-size:20px;opacity:.9}
  body.console .topbar{top:16px;left:16px}
  body.console .orbit-btn{margin-top:10px}
  /* live activity feed — bottom sheet that's always streaming, independent of node/edge taps */
  /* sits ABOVE the scrubber (46px) so the timeline stays visible; collapsed shows only its header */
  .feed{position:fixed;left:0;right:0;bottom:46px;z-index:15;background:rgba(12,10,8,.96);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
    transform:translateY(calc(100% - 42px));
    transition:transform .32s cubic-bezier(.4,0,.2,1);pointer-events:auto;max-height:64vh;display:flex;flex-direction:column}
  .feed.open{transform:translateY(0)}
  body:not(.console) .feed{display:none}
  .feed-head{height:42px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;cursor:pointer;user-select:none}
  .feed-head .fh-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:beat 1.6s ease-in-out infinite;flex:0 0 auto}
  .feed-head .fh-title{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream)}
  .feed-head .fh-count{font-size:9px;letter-spacing:.14em;color:var(--muted);margin-left:auto}
  .feed-head .fh-caret{font-size:10px;color:var(--muted);transition:transform .3s}
  .feed.open .fh-caret{transform:rotate(180deg)}
  .feed-list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px}
  .fi{display:flex;gap:10px;padding:9px 16px;border-top:1px solid rgba(237,228,211,.05)}
  .fi .fi-rail{width:3px;flex:0 0 auto;border-radius:2px;background:var(--amber)}
  .fi .fi-main{min-width:0;flex:1}
  .fi .fi-top{display:flex;gap:8px;align-items:baseline}
  .fi .fi-cat{font-size:8px;letter-spacing:.16em;text-transform:uppercase;padding:2px 6px;border-radius:3px;flex:0 0 auto}
  .fi .fi-who{font-size:11px;color:var(--cream);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fi .fi-who b{color:var(--amber);font-weight:500}
  .fi .fi-time{font-size:9px;color:var(--muted);margin-left:auto;flex:0 0 auto}
  .fi .fi-title{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fi.attn{background:rgba(232,162,37,.05)}

  @media (max-width:640px){
    .topbar{left:18px;top:60px}
    .readout{right:16px;top:18px;max-width:52vw}
    .hint{display:none}                              /* keyboard fly hints are irrelevant on touch */
    /* iOS-Safari WebGL hardening: full-screen mix-blend-mode overlays + an feTurbulence grain filter
       + backdrop-filter:blur over a live WebGL canvas are the classic "a problem repeatedly occurred"
       (OOM) triggers on mobile. They're pure decoration — drop them on small screens. */
    .fx{display:none!important}
    .panel,.msgpanel,.layers,.legend{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(14,11,9,.97)}
    /* collapsed-by-default panels stack in the top-right; folded they're just a title bar */
    .layers{top:132px;right:12px;min-width:0;padding:9px 11px}
    /* search docks just above the scrubber; results open UPWARD so they aren't hidden by it */
    .searchwrap{top:auto;bottom:54px;left:12px;right:12px;transform:none}
    .searchwrap input{width:100%}
    .searchres{position:absolute;left:0;right:0;bottom:calc(100% + 6px);margin-top:0;max-height:44vh}
    .legend{top:auto;bottom:104px;right:12px;max-width:66vw}   /* above the docked search */
    .collapsible .panel-body{max-height:38vh;overflow:auto}
    /* keep every scrubber control on-screen: tighter padding/gaps, shrinkable time readout */
    .scrubber{padding:0 8px;gap:6px;height:46px}
    .scr-btn{padding:5px 7px;font-size:9px;letter-spacing:.08em}
    .scr-time{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;font-size:9px;letter-spacing:.02em}
    .scr-win{padding:4px 4px;font-size:9px}
  }
</style>
</head>
<body>
<div id="brain-graph"></div>
<div id="pulse-labels"></div>

<div class="fx grain"></div>
<div class="fx scanlines"></div>
<div class="fx vignette"></div>
<div class="fx flicker"></div>

<div class="ui topbar">
  <div class="eyebrow"><span class="live"></span>Live VPS infrastructure · srv1397016</div>
  <div class="title">Second<br><span class="b">Brain</span></div>
  <div class="subtitle" id="subtitle">connecting…</div>
  <button class="orbit-btn" id="orbit-btn" title="slow flat-plane orbit around the center"><span class="oi"></span>Orbit</button>
</div>

<div class="ui searchwrap">
  <input id="search" placeholder="search agents · repos · clients · files…" autocomplete="off">
  <div class="searchres" id="searchres"></div>
</div>

<div class="ui readout">
  <div class="rk">Now inspecting</div>
  <div class="rv" id="rv">the whole operation</div>
  <div class="rp" id="rp" style="color:var(--amber)">all pillars</div>
</div>

<div class="ui layers collapsible" id="layers">
  <div class="lyr-title panel-head" data-collapse="layers">Layers<span class="caret">▾</span></div>
  <div class="panel-body">
    <label data-brainonly><input type="checkbox" data-layer="lobes"> Lobe boundaries</label>
    <label><input type="checkbox" data-layer="orbs"> Agent orbs</label>
    <label><input type="checkbox" data-layer="edges"> Edges</label>
    <label><input type="checkbox" data-layer="glows"> Edge glows</label>
    <label><input type="checkbox" data-layer="pulses"> Arrow sprites</label>
    <label><input type="checkbox" data-layer="labels"> Message labels</label>
    <label><input type="checkbox" data-layer="fx"> Retro FX</label>
    <div class="lyr-slider" data-brainonly>
      <div class="lyr-slabel">Collision offset · <span id="lyr-coll-val">2</span></div>
      <input type="range" id="lyr-coll" min="0" max="30" value="2">
    </div>
  </div>
</div>

<div class="ui legend collapsible" id="legend">
  <div class="lg-title panel-head" data-collapse="legend"><span class="ht">Pillars — click to isolate</span><span class="caret">▾</span></div>
  <div class="panel-body"><div class="rows" id="legend-rows"></div></div>
</div>

<div class="ui hint">
  <span><span class="k">W/S</span> up/down</span><span class="dot"></span>
  <span><span class="k">A/D</span> strafe</span><span class="dot"></span>

<script type="module">
import * as THREE from 'three'
import ForceGraph3D from 'https://esm.sh/3d-force-graph@1.73.4?external=three'
import { ConvexGeometry } from 'https://esm.sh/three@0.183.2/examples/jsm/geometries/ConvexGeometry.js?external=three'

const EMBED = new URLSearchParams(location.search).get('embed') === '1'
if (EMBED) document.body.classList.add('embed')
// ---- layout / "shape" selection ----
// A shape is pure presentation: the graph MODEL is identical for every layout (same /api/graph,
// same WS, same dual-baked coords) — only the client-side arrangement (positions/camera/dust)
// differs. Shapes get a clean route each (/field=pillars, /brain=brain, future /orbits …); the
// ?layout= query still works as an override for embeds where the path may be fixed.
const KNOWN_LAYOUTS = new Set(['pillars','brain'])
const ROUTE_LAYOUT = { field:'pillars', brain:'brain', console:'brain' }   // path segment → layout name
// CONSOLE mode (/console): the iOS-app surface — brain layout, desktop fluff stripped, finger-first
// hitboxes, and a live activity-feed drawer. Derived from the path so it's a distinct URL.
const CONSOLE = location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0] === 'console'
if (CONSOLE) document.body.classList.add('console')
function resolveLayout(){
  const q = new URLSearchParams(location.search).get('layout')
  if(q && KNOWN_LAYOUTS.has(q)) return q
  const seg = location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0]
  return ROUTE_LAYOUT[seg] || 'pillars'
}
const LAYOUT = resolveLayout()
// anatomical brain layout: nodes swap to their n.brain coords + pin, cluster becomes the
// functional region, hubs/queue/state drop out, and a dust point-cloud fills the silhouette.
const BRAIN = LAYOUT === 'brain'
const ALL_LABEL = BRAIN ? 'all regions' : 'all pillars'

// Pillar palette (default). In brain mode this is REPLACED by the server-provided region
// `legend` at init() time (rebuildClusters) — colorOf/isolate/dim/search/clusterTex inherit.
let CLUSTERS = {
  agents:{label:'AGENTS',color:'#E8A225'}, services:{label:'SERVICES',color:'#ec4899'},
  repos:{label:'REPOS',color:'#06b6d4'}, clients:{label:'CLIENTS',color:'#22c55e'},
  prompts:{label:'PROMPTS',color:'#8b5cf6'}, ops:{label:'OPS',color:'#f97316'},
  queue:{label:'MESSAGES',color:'#eab308'}, state:{label:'STATE',color:'#8A7F6E'},
}
let CL = Object.keys(CLUSTERS)
const colorOf = c => (CLUSTERS[c]?.color) || '#fff'
// pulse color by message type (mirrors MSG_COLORS in collect.js)
const MSG_COLORS = {escalate:'#ef4444',reply:'#06b6d4',route:'#E8A225',request:'#22c55e',
  broadcast:'#8b5cf6',status:'#8A7F6E',task:'#eab308',asset_registered:'#22c55e',
  // brain-mode synapse-fire classes (firehose): tool + client work
  uses_script:'#22d3ee',uses_prompt:'#8b5cf6',client_work:'#22c55e'}
const pulseColor = t => MSG_COLORS[t] || '#E8A225'

// one shared glow TEXTURE per cluster; each node gets its OWN material (sharing the
// texture) so we can dim individual nodes, not just whole clusters.
const clusterTex = {}
function makeTexture(color){
  const cv=document.createElement('canvas');cv.width=64;cv.height=64
  const ctx=cv.getContext('2d')
  const g=ctx.createRadialGradient(32,32,0,32,32,32)
  g.addColorStop(0,'#ffffff');g.addColorStop(.25,color);g.addColorStop(.65,color+'44');g.addColorStop(1,'transparent')
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64)
  return new THREE.CanvasTexture(cv)
}
CL.forEach(c=>clusterTex[c]=makeTexture(colorOf(c)))
const DIM=0.28, FULL=0.9   // node opacity when dimmed / normal (dimmed still legible)

const statusScale = s => s==='live'?1.35 : s==='hub'?1.0 : s==='idle'?0.95 : 0.55
function baseScale(n){ return (3 + Math.sqrt(n.val||6)*1.4) * statusScale(n.status) }

const el=document.getElementById('brain-graph')
const rv=document.getElementById('rv'), rp=document.getElementById('rp')
const panel=document.getElementById('panel')
let Graph=null, selected=null, focusId=null, neighborSet=null, DATA={nodes:[],links:[]}, byId=new Map()
let keyState={}   // WASDQE free-fly key state
const flashing=new Map() // id -> intensity
const commLinks=new Map() // "s|t" -> link obj
let spriteDirtyUntil=0    // re-anchor sprites in animFlashes until this time (see reapplyLinks)
let hoverNode=null, hoverLink=null   // what the cursor is over — drives the click-target highlight
const HOVER_SCALE=1.4     // how much a hovered node grows, so it's an obvious click target
// top-right Layers menu — toggle each render layer independently + collision-avoidance slider
const LAYERS={lobes:true,orbs:true,edges:true,glows:true,pulses:true,labels:true,fx:true}
let pulseGroup=null                 // arrow/glow/ember sprites live here so they toggle as one layer
let lobeCentroids={}, lobePlanes={} // set by loadBrainLobes; used by applyCollision to re-clamp orbs
let collisionOffset=2               // extra spacing (world units) enforced between agent orbs in a lobe

function nodeSprite(node){
  const m=new THREE.SpriteMaterial({map:clusterTex[node.cluster]||clusterTex.state||Object.values(clusterTex)[0],
    transparent:true,opacity:opacityFor(node),depthWrite:false,blending:THREE.AdditiveBlending})
  const sp=new THREE.Sprite(m)
  const s=baseScale(node); sp.scale.set(s,s,1)
  node.__obj=sp; node.__s=s; node.__mat=m
  return sp
}
// opacity a node should have under the current focus/cluster selection
function opacityFor(node){
  // hover wins over everything: the node under the cursor (or an endpoint of the hovered
  // edge) goes fully bright so you can see exactly what you're about to click.
  if(node===hoverNode) return 1
  if(hoverLink && (node.id===(hoverLink.source.id||hoverLink.source)||node.id===(hoverLink.target.id||hoverLink.target))) return 1
  if(focusId&&neighborSet) return neighborSet.has(node.id) ? (node.id===focusId?1:.95) : DIM
  if(selected) return node.cluster===selected ? .96 : DIM
  return FULL
}
function applyNodeDim(){ for(const n of DATA.nodes) if(n.__mat) n.__mat.opacity=opacityFor(n) }

// ---------- legend ----------
function renderLegend(){
  const rows=document.getElementById('legend-rows'); rows.innerHTML=''
  CL.forEach(c=>{
    const ct=DATA.nodes.filter(n=>n.cluster===c && n.kind!=='hub').length
    const e=document.createElement('div'); e.className='lg'; e.dataset.cluster=c
    e.innerHTML=`<span>${CLUSTERS[c].label}</span><span class="ct">${ct}</span><span class="sw" style="color:${colorOf(c)};background:${colorOf(c)}"></span>`
    e.addEventListener('click',()=>setSelected(c)); rows.appendChild(e)
  })
}
const clusterOf = end => (typeof end==='object'&&end) ? end.cluster : (byId.get(end)?.cluster)

// unified link styling — incorporates focus/select dimming AND time-activity heat (__act)
function linkColorFn(l){
  if(!LAYERS.edges) return 'rgba(0,0,0,0)'           // Edges layer off → hide all links
  if(l===hoverLink) return 'rgba(255,241,204,.98)'   // hovered edge: bright, wins over all dimming
  const a=l.source.id||l.source, b=l.target.id||l.target
  const act=LAYERS.glows?(l.__act||0):0              // Edge-glows layer off → ignore heat, no glow
  // dimming context
  if(focusId && !(a===focusId||b===focusId)) return act>0?`rgba(255,${(200-act*40)|0},${(120-act*80)|0},${(0.25+act*0.6).toFixed(3)})`:'rgba(237,228,211,.06)'
  if(selected && !(clusterOf(l.source)===selected||clusterOf(l.target)===selected)) return 'rgba(237,228,211,.06)'
  if(l.kind==='comm'){
    if(act>0){ // hot: base amber -> bright white-amber as activity rises
      const r=(232+(255-232)*act)|0, g=(162+(255-162)*act)|0, bl=(37+(235-37)*act)|0
      return `rgba(${r},${g},${bl},${(0.30+act*0.68).toFixed(3)})`
    }
    // In brain mode the resting comm web recedes so the anatomy reads; active/heated/focused
    // edges still light up via the branches above. Pillars keep the original weight.
    // Brain mode: a COLD, unfocused comm edge is fully transparent so the anatomy reads clean
    // (matches the edge-free silhouette). It reappears the instant it heats (act>0, handled above),
    // is hovered (handled at top), or its node is focused (the .75 branch here). Pillars unchanged.
    return (focusId&&(a===focusId||b===focusId))?'rgba(232,162,37,.75)':(BRAIN?'rgba(232,162,37,0)':'rgba(232,162,37,.32)')
  }
  // structural links (soul=agent→prompt, works_on=agent→repo/client): at rest in brain mode they
  // span brain→satellite and clutter the silhouette, so hide them unless a node is focused (which
  // reveals its connections) or the edge is hovered (handled at top). Pillars keep them visible.
  if(BRAIN && !(focusId&&(a===focusId||b===focusId))) return 'rgba(237,228,211,0)'
  return l.cross?'rgba(232,162,37,.26)':'rgba(237,228,211,.24)'
}
function linkWidthFn(l){
  // links are CylinderGeometry meshes (any width>0), so width is in WORLD units, not px.
  // over a ~950u graph, sub-unit widths are invisible — hence the visible skeleton floor below.
  let base=l.kind==='comm'?Math.min(0.8+Math.log2((l.weight||1)+1)*0.5,3.2):(l.kind==='member'?1.1:0.9)
  if(BRAIN&&l.kind==='comm') base*=0.5   // thinner resting web so the brain silhouette dominates
  const w=base + (LAYERS.glows?(l.__act||0):0)*1.8   // subtle swell; the comet is the primary motion cue
  return l===hoverLink ? w+2.2 : w  // hovered edge swells so it's an obvious click target
}
// Setting ANY link accessor makes three-forcegraph re-digest the scene, which resets every
// node object's position to (0,0,0) and relies on an engine tick to restore it. Our layout is
// static (engine stops after settle), so no tick comes — every sprite collapses to the origin
// and the whole graph renders as one dot at screen-center (looks like a "clump"). The digest is
// DEBOUNCED ~2 frames, so a synchronous re-anchor here would just get overwritten. Instead open
// a short window during which animFlashes re-anchors sprites every frame (covers the deferred
// digest + a rapid drag firing many reapplies). This fires on scrubber seeks AND live heat-decay.
function reapplyLinks(){ if(Graph){ Graph.linkColor(linkColorFn).linkWidth(linkWidthFn); if(window.__settled) spriteDirtyUntil=performance.now()+400 } }
function refreshLinks(){ reapplyLinks() }
// find the comm edge joining two actors regardless of stored direction
function commFor(s,t){ return commLinks.get(s+'|'+t)||commLinks.get(t+'|'+s)||null }
function clearLegendActive(){
  document.querySelectorAll('.lg').forEach(e=>{e.classList.remove('active','dim');e.style.background='';e.style.borderColor=''})
}
// ---------- focus a node: dim everything except it + its direct connections ----------
function neighborsOf(id){
  const s=new Set([id])
  for(const l of DATA.links){ const a=l.source.id||l.source, b=l.target.id||l.target
    if(a===id)s.add(b); else if(b===id)s.add(a) }
  return s
}
function focusOn(node){
  if(!node||node.kind==='hub'){ clearFocus(); return }
  selected=null; clearLegendActive()
  focusId=node.id; neighborSet=neighborsOf(node.id)
  applyNodeDim(); refreshLinks(); refreshLobes()
  rv.textContent=node.name; rp.textContent=`${neighborSet.size-1} connection${neighborSet.size===2?'':'s'}`; rp.style.color=colorOf(node.cluster)
}
function clearFocus(){
  if(!focusId&&!selected) { applyNodeDim(); refreshLinks(); return }
  focusId=null; neighborSet=null; selected=null; clearLegendActive()
  applyNodeDim(); refreshLinks(); refreshLobes()
  rv.textContent='the whole operation'; rp.textContent=ALL_LABEL; rp.style.color='var(--amber)'
}
function setSelected(c){
  focusId=null; neighborSet=null
  selected=(selected===c)?null:c
  applyNodeDim()
  document.querySelectorAll('.lg').forEach(e=>{
    const k=e.dataset.cluster
    e.classList.toggle('active',selected===k); e.classList.toggle('dim',!!selected&&selected!==k)
    e.style.background=selected===k?colorOf(k):''; e.style.borderColor=selected===k?colorOf(k):''
  })
  if(selected){ rv.textContent=CLUSTERS[selected].label; rp.textContent=`${DATA.nodes.filter(n=>n.cluster===selected&&n.kind!=='hub').length} nodes`; rp.style.color=colorOf(selected) }
  else { rv.textContent='the whole operation'; rp.textContent=ALL_LABEL; rp.style.color='var(--amber)' }
  refreshLinks(); refreshLobes()
  post('brain:isolate',{cluster:selected})
}

// ---------- detail panel ----------
function statusColor(s){return s==='live'?'#22c55e':s==='idle'?'#E8A225':s==='down'||s==='ember'?'#ef4444':'#8A7F6E'}
function showPanel(n){
  if(!n||n.kind==='hub'){panel.classList.remove('on');return}
  const m=n.meta||{}
  let rows=''
  const R=(lbl,val)=>val?`<div class="row"><span class="lbl">${lbl}</span>${val}</div>`:''
  rows+=R('Kind',n.kind)
  rows+=R('Status',`<b style="color:${statusColor(n.status)}">${n.status}</b>`)
  if(m.tier)rows+=R('Tier',m.tier)
  if(m.role)rows+=R('Role',m.role)
  if(m.tmux)rows+=R('tmux',`<b>${m.tmux}</b>`)
  if(m.cwd)rows+=R('cwd',m.cwd)
  if(m.path)rows+=R('Path',m.path)
  if(m.system_prompt)rows+=R('Prompt',m.system_prompt)
  if(m.lastCommitDaysAgo!=null)rows+=R('Last commit',m.lastCommitDaysAgo+'d ago')
  if(m.urlCount!=null)rows+=R('Deployed URLs',m.urlCount)
  if(m.deployed_urls&&m.deployed_urls.length){
    rows+=`<div class="row"><span class="lbl">Assets</span>`+m.deployed_urls.slice(0,8).map(u=>`<div><a href="${u.url}" target="_blank">${u.label||u.url}</a></div>`).join('')+`</div>`
  }
  const links=DATA.links.filter(l=>(l.source.id||l.source)===n.id||(l.target.id||l.target)===n.id)
  if(links.length)rows+=R('Connections',links.length)
  panel.innerHTML=`<div class="close" id="pclose">×</div>
    <div class="pk">${CLUSTERS[n.cluster]?.label||n.cluster}</div>
    <div class="pt" style="color:${colorOf(n.cluster)}">${n.name}</div>
    <span class="badge" style="background:${colorOf(n.cluster)}22;color:${colorOf(n.cluster)}">${n.cluster}</span>
    <span class="badge" style="background:${statusColor(n.status)}22;color:${statusColor(n.status)}">${n.status}</span>
    ${rows}`
  panel.classList.add('on')
  document.getElementById('pclose').onclick=()=>panel.classList.remove('on')
}

// ---------- search ----------
const searchEl=document.getElementById('search'), searchRes=document.getElementById('searchres')
function doSearch(q){
  q=q.trim().toLowerCase()
  if(!q){searchRes.classList.remove('on');return}
  const hits=DATA.nodes.filter(n=>n.kind!=='hub'&&(n.name.toLowerCase().includes(q)||n.id.toLowerCase().includes(q))).slice(0,12)
  searchRes.innerHTML=hits.map(n=>`<div class="r" data-id="${n.id}">${n.name}<span class="c" style="color:${colorOf(n.cluster)}">${n.cluster}</span></div>`).join('')||'<div class="r">no match</div>'
  searchRes.classList.add('on')
  searchRes.querySelectorAll('.r[data-id]').forEach(r=>r.onclick=()=>{flyTo(byId.get(r.dataset.id));searchRes.classList.remove('on')})
}
searchEl.addEventListener('input',e=>doSearch(e.target.value))
searchEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=DATA.nodes.find(n=>n.kind!=='hub'&&n.name.toLowerCase().includes(searchEl.value.toLowerCase()));if(f)flyTo(f)}})

function flyTo(n){
  if(!n||!Graph)return
  // Fly to a fixed standoff distance ALONG the current view direction, not by radially
  // scaling the node's position. The old k=1+d/r math exploded for nodes near the origin
  // (e.g. thalamus at brain-center, r→0), flinging the camera to infinity. Approaching from
  // where we already are is layout-agnostic and stable for both pillar and brain modes.
  const nx=n.x||0, ny=n.y||0, nz=n.z||0, d=120
  const cam=Graph.camera()
  let dx=cam.position.x-nx, dy=cam.position.y-ny, dz=cam.position.z-nz
  let len=Math.hypot(dx,dy,dz); if(len<1e-3){ dx=0; dy=0; dz=1; len=1 } // degenerate: back off +Z
  dx/=len; dy/=len; dz/=len
  Graph.cameraPosition({x:nx+dx*d,y:ny+dy*d,z:nz+dz*d},{x:nx,y:ny,z:nz},1100)
  showPanel(n); flashNode(n.id,1.6); focusOn(n)
}

// ---------- flash / pulse animation ----------
function flashNode(id,amt=1.2){flashing.set(id,Math.max(flashing.get(id)||0,amt))}

// custom traveling pulse: a glowing sprite that flies source->target. Self-contained
// (ForceGraph's emitParticle silently no-ops when linkDirectionalParticles=0).
let pulseTex=null
function pulseTexture(){
  if(pulseTex)return pulseTex
  const cv=document.createElement('canvas');cv.width=32;cv.height=32
  const x=cv.getContext('2d'),g=x.createRadialGradient(16,16,0,16,16,16)
  g.addColorStop(0,'#fff');g.addColorStop(.4,'rgba(255,255,255,.9)');g.addColorStop(1,'transparent')
  x.fillStyle=g;x.fillRect(0,0,32,32)
  pulseTex=new THREE.CanvasTexture(cv);return pulseTex
}
const activePulses=[] // {head,glow,embers,label,a,b,t,dur,col,quat,arrived}
const TAIL_N=9           // ember sprites forming the tapering tail
const TAIL_FRAC=0.28     // tail length as a fraction of the edge
const labelsEl=document.getElementById('pulse-labels')
const coneGeo=new THREE.ConeGeometry(4.4,15,10)   // shared arrowhead geometry (points +Y)
const UP=new THREE.Vector3(0,1,0)
function pulseLink(s,t,type){
  ensureCommLink(s,t) // keep the static edge present for context + click-to-inspect
  const link=commFor(s,t); if(link) link.__act=1   // light the edge (heat)
  const a=byId.get(s), b=byId.get(t); if(!a||!b||!Graph)return
  const col=new THREE.Color(pulseColor(type))
  flashNode(s,1.4)                                  // SENDER glows the instant the message leaves
  // direction of travel -> orient the cone arrowhead to point at the receiver
  const dir=new THREE.Vector3((b.x||0)-(a.x||0),(b.y||0)-(a.y||0),(b.z||0)-(a.z||0)).normalize()
  const quat=new THREE.Quaternion().setFromUnitVectors(UP,dir)
  // arrowhead (a real 3D shape that moves + points where the message is going)
  const head=new THREE.Mesh(coneGeo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false}))
  head.quaternion.copy(quat)
  // bright glow core co-located with the arrowhead
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:pulseTexture(),color:col,transparent:true,
    opacity:0,depthWrite:false,blending:THREE.AdditiveBlending})); glow.scale.setScalar(14)
  // tapering ember tail
  const embers=[]
  const PG=pulseGroup||Graph.scene()   // arrow/glow/ember sprites go in the toggleable pulse layer
  for(let j=0;j<TAIL_N;j++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:pulseTexture(),color:col,transparent:true,
      opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}))
    PG.add(sp); embers.push(sp)
  }
  PG.add(glow); PG.add(head)
  // HTML label that rides with the arrowhead
  const label=document.createElement('div'); label.className='plabel'
  label.textContent=type||'msg'; label.style.color=pulseColor(type); labelsEl.appendChild(label)
  activePulses.push({head,glow,embers,label,a,b,t:0,dur:2400+Math.random()*400,col,arrived:false,toId:t})
}
function animFlashes(now){
  // node flashes
  for(const[id,v]of flashing){
    const n=byId.get(id); if(n&&n.__obj){const s=n.__s*(1+v);n.__obj.scale.set(s,s,1)}
    const nv=v-0.045; if(nv<=0){flashing.delete(id);if(n&&n.__obj)n.__obj.scale.set(n.__s,n.__s,1)}else flashing.set(id,nv)
  }
  // hovered node: sustain a scale boost so it reads as the click target (flash takes precedence)
  if(hoverNode&&hoverNode.__obj&&!flashing.has(hoverNode.id)){
    const s=hoverNode.__s*HOVER_SCALE; hoverNode.__obj.scale.set(s,s,1)
  }
  // traveling pulses: arrowhead + glow core + ember tail + following label
  const dt=animFlashes._last?now-animFlashes._last:16; animFlashes._last=now
  const cam=Graph&&Graph.camera(), W=el.clientWidth, H=el.clientHeight
  for(let i=activePulses.length-1;i>=0;i--){
    const p=activePulses[i]; p.t+=dt
    const f=p.t/p.dur
    if(f>=1){
      const PG=pulseGroup||Graph.scene(); PG.remove(p.head); PG.remove(p.glow)
      p.head.material.dispose(); p.glow.material.dispose()
      for(const sp of p.embers){ PG.remove(sp); sp.material.dispose() }
      if(p.label.parentNode) p.label.remove()
      activePulses.splice(i,1); continue
    }
    const e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2 // easeInOut head position along edge
    const ax=p.a.x||0,ay=p.a.y||0,az=p.a.z||0, bx=p.b.x||0,by=p.b.y||0,bz=p.b.z||0
    const hx=ax+(bx-ax)*e, hy=ay+(by-ay)*e, hz=az+(bz-az)*e
    const gFade=Math.min(1,Math.sin(f*Math.PI)*1.6) // fade in/out over life
    // RECEIVER glows the instant the message lands
    if(!p.arrived && e>=0.985){ p.arrived=true; flashNode(p.toId,1.6) }
    // arrowhead
    p.head.position.set(hx,hy,hz)
    p.head.material.opacity=gFade
    const hs=1+Math.sin(f*Math.PI)*0.3; p.head.scale.setScalar(hs)
    // glow core
    p.glow.position.set(hx,hy,hz)
    p.glow.material.opacity=gFade*0.9
    p.glow.scale.setScalar(10+Math.sin(f*Math.PI)*6)
    // ember tail (behind the head, toward sender)
    for(let j=0;j<p.embers.length;j++){
      const sp=p.embers[j]
      const u=(j+1)/TAIL_N                       // >0, trailing behind head
      const frac=Math.max(0,e-TAIL_FRAC*u)
      sp.position.set(ax+(bx-ax)*frac, ay+(by-ay)*frac, az+(bz-az)*frac)
      const taper=1-u
      sp.scale.setScalar(3+9*taper*taper)
      sp.material.opacity=gFade*Math.pow(taper,1.4)*0.8
    }
    // label follows the arrowhead (project 3D -> screen)
    if(cam){
      const v=new THREE.Vector3(hx,hy,hz).project(cam)
      if(v.z<1){ p.label.style.display='block'
        p.label.style.left=((v.x*0.5+0.5)*W)+'px'; p.label.style.top=((-v.y*0.5+0.5)*H)+'px'
        p.label.style.opacity=gFade
      } else p.label.style.display='none'
    }
  }
  // edge heat decay: fade each active edge over ~1.6s; throttled re-apply so the glow renders.
  // Sustained heat (brain-mode client_work): while now < __heatUntil hold __act at a ~0.5 floor
  // so the edge stays visibly warm for the duration the client is being worked on, then it
  // rejoins normal decay. (__heatUntil is an epoch ms sent by the server's link.heat event.)
  let anyAct=false
  const nowE=Date.now()
  for(const l of DATA.links){
    if(l.__heatUntil && nowE<l.__heatUntil){ l.__act=Math.max(l.__act||0,0.5); anyAct=true; continue }
    if(l.__act){ l.__act=Math.max(0,l.__act-dt/1600); anyAct=true }
  }
  if(anyAct && now-(animFlashes._lastLink||0)>70){ reapplyLinks(); animFlashes._lastLink=now }
  // WASDQE free-fly movement + slow auto-orbit
  const flying=flyStep(dt)
  const orbited=orbitStep(dt)
  // spriteDirty keeps us RENDERING for a short window after a link restyle (see reapplyLinks),
  // so a drag visibly stays glued instead of freezing on a collapsed frame.
  const spriteDirty=now<spriteDirtyUntil
  // CRITICAL: after the force sim cools, ForceGraph throttles its render loop to a few fps,
  // so our per-frame sprite moves would only paint occasionally (comet appears to teleport).
  // While anything is animating (pulses/flashes/heat/flying) or re-anchoring, force a full-rate render.
  if(Graph && (activePulses.length || flashing.size || anyAct || flying || orbited || spriteDirty || hoverNode || hoverLink)){
    // Re-anchor sprites to their static node coords IMMEDIATELY before painting. Setting any link
    // accessor triggers three-forcegraph's debounced scene digest, which resets node objects to
    // (0,0,0) and expects an engine tick to restore them — but our engine is stopped, so without
    // this every seek/heat-decay would paint the whole graph collapsed to one dot at screen-center.
    // Doing it right before render (not on a timer) guarantees a collapsed frame is never shown.
    if(window.__settled) syncSprites()
    try{ Graph.renderer().render(Graph.scene(), Graph.camera()) }catch(e){}
  }
  requestAnimationFrame(animFlashes)
}

// ---- slow flat-plane auto-orbit (top-left button) ----
// Circles the brain's center at a fixed height (camera pitch = 0 → level horizon), so the whole
// constellation sweeps by on a flat turntable. Runs in the animFlashes loop; any manual drag/fly
// cancels it so the user always wins.
let orbiting=false, orbitAngle=0, orbitR=800, orbitCtr={x:0,y:0,z:0}
const ORBIT_SPEED=0.11   // radians/sec — slow
function graphCenter(){
  let N=DATA.nodes; if(BRAIN){ const b=N.filter(n=>BRAIN_REGIONS.has(n.cluster)); if(b.length) N=b }
  if(!N.length) return {x:0,y:0,z:0}
  let cx=0,cy=0,cz=0; for(const n of N){cx+=n.x||0;cy+=n.y||0;cz+=n.z||0}
  const k=N.length; return {x:cx/k,y:cy/k,z:cz/k}
}
function setOrbit(on){
  orbiting=on
  const btn=document.getElementById('orbit-btn'); if(btn) btn.classList.toggle('on',on)
  if(on&&Graph){
    orbitCtr=graphCenter()
    const cam=Graph.camera()
    orbitR=Math.hypot(cam.position.x-orbitCtr.x, cam.position.z-orbitCtr.z)||orbitR
    orbitAngle=Math.atan2(cam.position.z-orbitCtr.z, cam.position.x-orbitCtr.x)
    // lock the camera's up-vector to world +Y so the horizon is level — kills any roll left over
    // from a prior free-fly/drag so the orbit is a purely LATERAL turntable around the Y axis.
    cam.up.set(0,1,0)
    if(window.__controls){ window.__controls.autoRotate=false; window.__controls.object.up.set(0,1,0) }
  }
}
function orbitStep(dt){
  if(!orbiting||!Graph) return false
  orbitAngle+=ORBIT_SPEED*Math.min(dt,50)/1000
  const c=orbitCtr, cam=Graph.camera()
  // camera y == center y → pitch 0 (level); position sweeps the x–z circle → rotation about world Y.
  cam.position.set(c.x+Math.cos(orbitAngle)*orbitR, c.y, c.z+Math.sin(orbitAngle)*orbitR)
  cam.up.set(0,1,0)                                   // keep up on world Y every frame → no roll
  const ctrl=window.__controls
  if(ctrl){ ctrl.object.up.set(0,1,0); ctrl.target.set(c.x,c.y,c.z); ctrl.update() } else cam.lookAt(c.x,c.y,c.z)
  return true
}
// translate camera + orbit target together along the view basis; returns true if moved
const FLY_SPEED=620 // world-units per second
function flyStep(dt){
  if(!Graph) return false
  const c=window.__controls; if(!c) return false
  const kx=(keyState.d?1:0)-(keyState.a?1:0)  // right/left  (A/D strafe)
  const ky=(keyState.w?1:0)-(keyState.s?1:0)  // up/down     (W up, S down)
  const kz=(keyState.e?1:0)-(keyState.q?1:0)  // forward/back (E forward, Q back)
  if(!kx&&!ky&&!kz) return false
  const cam=Graph.camera(), tgt=c.target
  cam.updateMatrixWorld()
  // basis from the CAMERA's own world matrix, so movement is always relative to what you see:
  // d=screen-right, w=screen-up, e=into-screen — correct at any orientation, even rolled/upside-down.
  const right=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0)          // camera +X
  const up=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1)             // camera +Y
  const fwd=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,2).negate()   // camera -Z (look dir)
  const move=new THREE.Vector3()
    .addScaledVector(fwd,kz).addScaledVector(right,kx).addScaledVector(up,ky)
  if(move.lengthSq()===0) return false
  move.normalize().multiplyScalar(FLY_SPEED*Math.min(dt,50)/1000) // clamp dt so a stutter can't teleport
  cam.position.add(move); tgt.add(move)
  c.update()
  return true
}

function indexCommLinks(){ // register comm edges from the snapshot so pulses reuse them
  commLinks.clear()
  for(const l of DATA.links){ if(l.kind==='comm'){const s=l.source.id||l.source,t=l.target.id||l.target;commLinks.set(s+'|'+t,l)} }
}
function ensureCommLink(s,t){
  const key=s+'|'+t
  if(commLinks.has(key))return commLinks.get(key)
  if(!byId.has(s)||!byId.has(t))return null
  const l={source:s,target:t,kind:'comm',__new:true,cross:true}
  DATA.links.push(l); commLinks.set(key,l)
  Graph.graphData(DATA)
  return l
}

function fmtT(iso){ try{const d=new Date(iso);return d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return iso} }
async function inspectEdge(aId,bId){

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) }

// ---------- time scrubber: replay the last N hours of message flow ----------
const scr={ events:[], hours:6, playing:false, idx:0, live:true, t0:0, t1:0, raf:0, speed:1 }
const scrRange=document.getElementById('scr-range'), scrTime=document.getElementById('scr-time')
const scrToggle=document.getElementById('scr-toggle'), scrLiveBtn=document.getElementById('scr-live'), scrWin=document.getElementById('scr-win')
async function loadHistory(hours){
  try{
    // messages (recent) + agent spawns (span the full window) merged into one timeline, sorted by time
    const [hr,sr]=await Promise.all([
      fetch(`/api/history?hours=${hours}`).then(r=>r.json()).catch(()=>({events:[]})),
      fetch(`/api/spawns?hours=${hours}`).then(r=>r.json()).catch(()=>({events:[]}))
    ])
    const ev=[...(hr.events||[]), ...(sr.events||[])].sort((a,b)=> a.t<b.t?-1:a.t>b.t?1:0)
    scr.events=ev; scr.hours=hours; scr.spawnCount=(sr.events||[]).length
    if(ev.length){ scr.t0=+new Date(ev[0].t); scr.t1=+new Date(ev[ev.length-1].t) }
  }catch{ scr.events=[] }
}
const scrClock=tt=>new Date(tt).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
function clearHeat(){ for(const l of DATA.links) l.__act=0; reapplyLinks() }
function scrSetLive(){
  scr.live=true; scr.playing=false; cancelAnimationFrame(scr.raf)
  scrToggle.textContent='▶'; scrToggle.classList.remove('on')
  scrLiveBtn.classList.add('live'); scrTime.textContent='live'; scrTime.classList.remove('replay')
  scrRange.value=1000; clearHeat()
}
// snapshot: light the most-recent messages leading up to the cursor, with recency
// falloff. Traffic is bursty (hours-long gaps), so we rank by count, not clock time,
// which guarantees DRAGGING always shows the recent activity trail at that point.
const SNAP_N=22 // how many recent messages form the trail
function applySnapshotAt(cursorMs){
  for(const l of DATA.links) if(l.kind==='comm') l.__act=0
  // find index of last event at/before cursor
  let hi=-1; for(let i=0;i<scr.events.length;i++){ if(+new Date(scr.events[i].t)<=cursorMs) hi=i; else break }
  let lit=0
  for(let k=0;k<SNAP_N && hi-k>=0;k++){
    const e=scr.events[hi-k]
    const link=commFor(e.from,e.to)
    const w=1-(k/SNAP_N)*0.82   // newest ~1.0, oldest in trail ~0.18
    if(link){ link.__act=Math.max(link.__act, w); lit++ }
  }
  reapplyLinks(); return lit
}
function scrSeekToFraction(f){
  scr.live=false; scrLiveBtn.classList.remove('live'); scrTime.classList.add('replay')
  const span=scr.t1-scr.t0||1, tt=scr.t0+span*f
  scr.cursor=tt
  scr.idx=scr.events.findIndex(e=>+new Date(e.t)>tt); if(scr.idx<0)scr.idx=scr.events.length
  applySnapshotAt(tt)
  scrTime.textContent=scrClock(tt)
}
function scrPlay(){
  if(!scr.events.length)return
  scr.live=false; scr.playing=true; scrToggle.textContent='❚❚'; scrToggle.classList.add('on')
  scrLiveBtn.classList.remove('live'); scrTime.classList.add('replay')
  const span=scr.t1-scr.t0||1
  // start cursor from the current slider position; if we're at/near the end, restart from the beginning
  let f=scrRange.value/1000
  if(f>=0.999){ f=0 }
  scr.cursor=scr.t0+span*f
  // set idx to the first event at/after the cursor so we don't re-fire the past
  scr.idx=scr.events.findIndex(e=>+new Date(e.t)>scr.cursor); if(scr.idx<0)scr.idx=scr.events.length
  let last=performance.now()
  const REPLAY_MS=45000 // whole window plays in ~45s
  const step=(now)=>{
    if(!scr.playing)return
    const dt=now-last; last=now
    scr.cursor+=dt/REPLAY_MS*span
    while(scr.idx<scr.events.length && +new Date(scr.events[scr.idx].t)<=scr.cursor){
      const e=scr.events[scr.idx]
      if(e.kind==='spawn'){ flashNode(e.id,2.4); ticker(`◆ spawned · ${e.name}`) }   // agent first-appearance
      else { pulseLink(e.from,e.to,e.type); ticker(`${e.fromName} → ${e.toName} · ${e.type||'msg'}`) }
      scr.idx++
    }
    scrRange.value=Math.min(1000,Math.max(0,(scr.cursor-scr.t0)/span*1000))
    scrTime.textContent=new Date(scr.cursor).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
    if(scr.idx>=scr.events.length){ scrSetLive(); return }
    scr.raf=requestAnimationFrame(step)
  }
  scr.raf=requestAnimationFrame(step)
}
function scrPause(){ scr.playing=false; cancelAnimationFrame(scr.raf); scrToggle.textContent='▶'; scrToggle.classList.remove('on') }
scrToggle.onclick=()=>{ if(scr.playing)scrPause(); else scrPlay() }
scrLiveBtn.onclick=()=>scrSetLive()
scrRange.oninput=()=>{ scrPause(); scr.cursor=scr.t0+(scr.t1-scr.t0)*(scrRange.value/1000); scrSeekToFraction(scrRange.value/1000) }
scrWin.onchange=async()=>{ await loadHistory(+scrWin.value); if(!scr.live)scrSetLive() }

// ---------- settle: guarantee sprites sit on node coords + frame the whole constellation ----------
function syncSprites(){ for(const n of DATA.nodes) if(n.__obj) n.__obj.position.set(n.x||0,n.y||0,n.z||0) }
// Freeze the constellation once it has settled: pin every node at its settled position
// (fx/fy/fz). Any later Graph.graphData() call (replay adds comm edges, live spawns/removals)
// reheats the force sim to alpha=1 — without pins, the ~518 unpinned nodes churn and drift
// into a single ball. Pinning makes those graphData() calls layout no-ops. Hubs come pre-pinned.
function pinNode(n){ if(n&&n.x!=null){ n.fx=n.x; n.fy=n.y; n.fz=n.z } }
function pinAll(){ for(const n of DATA.nodes) pinNode(n) }
const BRAIN_REGIONS=new Set(['prefrontal','frontal','motor','parietal','temporal','occipital','cerebellum','brainstem','hippocampus','thalamus'])
function frameCamera(){
  let N=DATA.nodes; if(!N.length)return
  // In brain mode, frame ONLY the anatomical anchors (not the far satellite rings), so the brain
  // fills the view and clients/repos/prompts drift to the edges instead of shrinking it face-on.
  if(BRAIN){ const b=N.filter(n=>BRAIN_REGIONS.has(n.cluster)); if(b.length) N=b }
  let cx=0,cy=0,cz=0; for(const n of N){cx+=n.x||0;cy+=n.y||0;cz+=n.z||0}
  cx/=N.length;cy/=N.length;cz/=N.length
  let R=1; for(const n of N){const d=Math.hypot((n.x||0)-cx,(n.y||0)-cy,(n.z||0)-cz); if(d>R)R=d}
  const fov=(Graph.camera().fov||50)*Math.PI/180
  const dist=(R/Math.sin(fov/2))*1.15
  // pillars: head-on down +Z. brain: front-above 3/4 (angled anterior, lifted, off to one side) so
  // BOTH the lobe profile AND the left/right hemisphere split read at once; unit-length offset.
  if(BRAIN) Graph.cameraPosition({x:cx+dist*0.52,y:cy+dist*0.55,z:cz+dist*0.66},{x:cx,y:cy,z:cz},900)
  else Graph.cameraPosition({x:cx,y:cy,z:cz+dist},{x:cx,y:cy,z:cz},900)
}
function settleView(){
  syncSprites()
  if(window.__settled)return
  window.__settled=1; pinAll(); frameCamera()   // freeze layout so replay/spawn graphData() can't reheat it into a ball
  document.getElementById('loader').classList.add('gone')
}

// ---------- brain mode: swap to anatomical positions + pin, region palette, dust shell ----------
// Replace the pillar palette with the server-shipped region legend so colorOf/isolate/dim/
// search/clusterTex all inherit the anatomical regions with zero downstream changes.
function rebuildClusters(legend){
  if(!legend) return
  CLUSTERS={}
  for(const k in legend) CLUSTERS[k]={label:legend[k].label,color:legend[k].color}
  CL=Object.keys(CLUSTERS)
  for(const k of Object.keys(clusterTex)){ clusterTex[k]?.dispose?.(); delete clusterTex[k] }
  CL.forEach(c=>clusterTex[c]=makeTexture(colorOf(c)))
}
// Swap a node onto its anatomical anchor and PIN it (fx/fy/fz). Anchors ARE the layout — if the
// force engine ran on unpinned nodes it would smear the brain into a ball over its cooldown ticks.
function applyBrainSwap(n){
  if(!n||!n.brain) return false
  n.x=n.brain.x; n.y=n.brain.y; n.z=n.brain.z
  n.fx=n.x; n.fy=n.y; n.fz=n.z
  n.cluster=n.brain.region
  return true
}
// Transform the whole snapshot before init() builds the graph: palette, drop brain:null nodes
// (hubs/queue/state), swap+pin the rest. Links to dropped hubs are cleaned by init()'s existing
// dangling-endpoint filter. Runs for BOTH boot paths (fetch /api/graph and WS init fallback).
function applyBrainMode(data){
  rebuildClusters(data.legend)
  DATA.nodes=DATA.nodes.filter(n=>n.brain)     // hubs/queue/state carry brain:null → hidden
  for(const n of DATA.nodes) applyBrainSwap(n)
  byId=new Map(DATA.nodes.map(n=>[n.id,n]))
  const lt=document.querySelector('.legend .lg-title .ht'); if(lt) lt.textContent='Regions — click to isolate'
  const rpEl=document.getElementById('rp'); if(rpEl) rpEl.textContent=ALL_LABEL
}
// Translucent anatomical "lobes": one convex-hull mesh per brain region, region-coloured, with a
// fresnel rim so each lobe reads as a soft glowing volume rather than a flat shell. Built from the
// same /api/brain-points cloud and added straight to the scene (outside the forcegraph digest, so
// no interaction with the link-accessor collapse landmine). Agent anchor sprites sit on top.
const LOBE_VERT=`
  varying vec3 vN; varying vec3 vV;
  void main(){ vec4 wp=modelMatrix*vec4(position,1.0);
    vN=normalize(mat3(modelMatrix)*normal); vV=normalize(cameraPosition-wp.xyz);
    gl_Position=projectionMatrix*viewMatrix*wp; }`
const LOBE_FRAG=`
  uniform vec3 uColor; uniform float uBody; uniform float uRimPow; uniform float uRimBoost; uniform float uDim;
  varying vec3 vN; varying vec3 vV;
  void main(){ float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),uRimPow);
    vec3 col=uColor+uColor*f*uRimBoost;
    float a=(uBody+f*uBody*2.0)*uDim;
    gl_FragColor=vec4(col,a); }`
const LOBE_SHRINK=0.90    // mild pull toward centroid → some separation without losing the shape
const AGENT_SHRINK=0.80   // pull each region-agent toward its lobe centroid → orbs sit INSIDE the lobe
const HEMI_MIN=12         // min points per side to treat a region as bilateral (else it stays midline-whole)
function centroidOf(pts){ let x=0,y=0,z=0; for(const p of pts){x+=p.x;y+=p.y;z+=p.z} const n=pts.length||1; return {x:x/n,y:y/n,z:z/n} }
// Anatomically-accurate convex hull of the region-hemisphere points (kept STRICTLY convex — any
// smoothing breaks convexity and, under the transparent double-sided material, the resulting folds
// stack into a muddy tangle). Smooth vertex normals soften the shading; mild centroid shrink separates.
function makeLobe(points,region,ctr){
  if(points.length<8) return null
  let geo; try{ geo=new ConvexGeometry(points.map(p=>new THREE.Vector3(p.x,p.y,p.z))) }catch(e){ return null }
  const pos=geo.attributes.position
  for(let i=0;i<pos.count;i++){ pos.setXYZ(i, ctr.x+(pos.getX(i)-ctr.x)*LOBE_SHRINK, ctr.y+(pos.getY(i)-ctr.y)*LOBE_SHRINK, ctr.z+(pos.getZ(i)-ctr.z)*LOBE_SHRINK) }
  pos.needsUpdate=true; geo.computeVertexNormals()
  const mat=new THREE.ShaderMaterial({
    uniforms:{ uColor:{value:new THREE.Color(colorOf(region))},
      uBody:{value:0.12}, uRimPow:{value:2.0}, uRimBoost:{value:1.7}, uDim:{value:1} },
    vertexShader:LOBE_VERT, fragmentShader:LOBE_FRAG,
    transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.NormalBlending })
  const mesh=new THREE.Mesh(geo,mat); mesh.renderOrder=-2; mesh.userData.region=region
  return mesh
}
function lobeSideOf(node,splitReg){ return splitReg.has(node.cluster) ? (node.x<0?'L':'R') : 'W' }
// Outward face planes of a (non-indexed) convex hull, oriented away from centroid c.
function facePlanes(geo,c){
  const pos=geo.attributes.position, planes=[]
  for(let i=0;i<pos.count;i+=3){
    const ax=pos.getX(i),ay=pos.getY(i),az=pos.getZ(i)
    const bx=pos.getX(i+1),by=pos.getY(i+1),bz=pos.getZ(i+1), cx=pos.getX(i+2),cy=pos.getY(i+2),cz=pos.getZ(i+2)
    let nx=(by-ay)*(cz-az)-(bz-az)*(cy-ay), ny=(bz-az)*(cx-ax)-(bx-ax)*(cz-az), nz=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax)
    const L=Math.hypot(nx,ny,nz)||1; nx/=L;ny/=L;nz/=L
    if(nx*(ax-c.x)+ny*(ay-c.y)+nz*(az-c.z)<0){ nx=-nx;ny=-ny;nz=-nz }
    planes.push(nx,ny,nz, nx*ax+ny*ay+nz*az)
  }
  return planes
}
// Distance from interior point c along unit dir until the convex hull is exited (min front-facing plane).
function hullExit(pl,c,dx,dy,dz){
  let t=Infinity
  for(let i=0;i<pl.length;i+=4){ const den=pl[i]*dx+pl[i+1]*dy+pl[i+2]*dz
    if(den>1e-6){ const tt=(pl[i+3]-(pl[i]*c.x+pl[i+1]*c.y+pl[i+2]*c.z))/den; if(tt>0&&tt<t) t=tt } }
  return t
}
async function loadBrainLobes(){
  if(!Graph) return
  try{
    const a=await (await fetch('/api/brain-points')).json()
    const grp=new THREE.Group(); lobeCentroids={}; lobePlanes={}; const splitReg=new Set()
    for(const region in a.regions){
      const all=a.regions[region]
      // Split each region at the sagittal midline (x = L-R axis) into hemispheres so the bilateral
      // structure + central fissure read; midline-only regions (too few points one side) stay whole.
      const L=all.filter(p=>p.x<0), R=all.filter(p=>p.x>=0)
      const sides = (Math.min(L.length,R.length)>=HEMI_MIN) ? (splitReg.add(region),[['L',L],['R',R]]) : [['W',all]]
      for(const [side,pts] of sides){ const c=centroidOf(pts); const key=region+'|'+side; lobeCentroids[key]=c
        const m=makeLobe(pts,region,c); if(m){ grp.add(m); lobePlanes[key]=facePlanes(m.geometry,c) } }
    }
    Graph.scene().add(grp); window.__lobes=grp
    // Seat every region-agent INSIDE its lobe: cast a ray from the lobe centroid through the agent and
    // clamp its distance to 90% of where that ray exits the (shrunk) convex hull. Centroid ∈ convex
    // hull ⇒ containment GUARANTEED. Record the seed position for the collision-offset relaxation.
    for(const n of DATA.nodes){
      if(!BRAIN_REGIONS.has(n.cluster)) continue
      const key=n.cluster+'|'+lobeSideOf(n,splitReg), c=lobeCentroids[key], pl=lobePlanes[key]; if(!c||!pl) continue
      let dx=n.x-c.x, dy=n.y-c.y, dz=n.z-c.z; const r=Math.hypot(dx,dy,dz)||1; dx/=r;dy/=r;dz/=r
      const texit=hullExit(pl,c,dx,dy,dz)
      const rr = isFinite(texit) ? Math.min(r, texit*0.90) : r*AGENT_SHRINK
      n.x=c.x+dx*rr; n.y=c.y+dy*rr; n.z=c.z+dz*rr
      n.__lobeKey=key; n.__r=baseScale(n); n.__seed={x:n.x,y:n.y,z:n.z}
    }
    applyCollision(collisionOffset)   // enforce inter-orb spacing (re-clamped to stay inside the hull)
  }catch(e){ console.warn('[brain] lobes failed',e) }
}

// Client-side collision avoidance: from each orb's seeded position, push same-lobe orbs apart until
// they're at least (rA+rB+offset) apart, then re-clamp every orb inside its convex hull. Live-tunable
// via the top-right slider. Starts from the seed each call so lowering the offset relaxes correctly.
function applyCollision(offset){
  collisionOffset=offset
  const agents=DATA.nodes.filter(n=>n.__seed && n.__lobeKey)
  if(!agents.length) return
  for(const n of agents){ n.x=n.__seed.x; n.y=n.__seed.y; n.z=n.__seed.z }
  const byLobe=new Map()
  for(const n of agents){ let arr=byLobe.get(n.__lobeKey); if(!arr){ arr=[]; byLobe.set(n.__lobeKey,arr) } arr.push(n) }
  for(let it=0;it<6;it++){
    for(const [key,arr] of byLobe){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A=arr[i],B=arr[j]; let dx=B.x-A.x,dy=B.y-A.y,dz=B.z-A.z; let d=Math.hypot(dx,dy,dz)||1e-3
        const need=A.__r+B.__r+offset
        if(d<need){ const p=(need-d)/2/d; dx*=p;dy*=p;dz*=p; A.x-=dx;A.y-=dy;A.z-=dz; B.x+=dx;B.y+=dy;B.z+=dz }
      }
      const c=lobeCentroids[key], pl=lobePlanes[key]; if(!c||!pl) continue
      for(const n of arr){ let ex=n.x-c.x,ey=n.y-c.y,ez=n.z-c.z; const r=Math.hypot(ex,ey,ez)||1; ex/=r;ey/=r;ez/=r
        const t=hullExit(pl,c,ex,ey,ez), rr=isFinite(t)?Math.min(r,t*0.90):r
        n.x=c.x+ex*rr; n.y=c.y+ey*rr; n.z=c.z+ez*rr }
    }
  }
  for(const n of agents){ n.fx=n.x; n.fy=n.y; n.fz=n.z }
  if(window.__settled){ syncSprites(); kick() }
}

// ---------- init graph ----------
function init(data){

  // endpoint, which aborts the whole link force and makes EVERY connection disappear
  // (nodes still render). Stale comm edges to removed agents are the usual culprit.
  DATA.links=DATA.links.filter(l=>byId.has(l.source.id||l.source)&&byId.has(l.target.id||l.target))
  indexCommLinks()
  Graph=ForceGraph3D()(el)
    .graphData(DATA)
    .width(el.clientWidth).height(el.clientHeight)
    .backgroundColor('#1E1A17').showNavInfo(false)
    .nodeThreeObject(nodeSprite).nodeThreeObjectExtend(false)
    .nodeVal('val')
    .nodeLabel(n=>`<div style="color:${colorOf(n.cluster)};font-family:'Azeret Mono',monospace;font-size:12px;background:rgba(10,8,6,.92);padding:7px 11px;border-radius:6px;line-height:1.5;border:1px solid rgba(237,228,211,.14)"><div>${n.name}</div><div style="opacity:.5;font-size:9px;letter-spacing:.14em;margin-top:3px">${n.cluster} · ${n.status}</div></div>`)
    .linkColor(linkColorFn)
    .linkWidth(linkWidthFn).linkOpacity(1)
    .linkDirectionalParticles(0).linkDirectionalParticleWidth(2.2).linkDirectionalParticleSpeed(.01)
    .linkDirectionalParticleColor(l=> l.__pcolor || 'rgba(232,162,37,.8)')
    .enableNodeDrag(false)
    .warmupTicks(0).cooldownTicks(300).d3AlphaDecay(0.0182).d3VelocityDecay(0.28)
    .onEngineStop(()=>settleView())
    .onNodeHover(n=>{
      // restore the previously-hovered node's resting scale (unless it's mid-flash)
      if(hoverNode&&hoverNode!==n&&hoverNode.__obj&&!flashing.has(hoverNode.id)) hoverNode.__obj.scale.set(hoverNode.__s,hoverNode.__s,1)
      hoverNode=n
      applyNodeDim()                              // brighten it (and dim-restore the rest)

      el.style.cursor=(n||hoverLink)?'pointer':'grab'
      if(n){rv.textContent=n.name;rp.textContent=n.cluster;rp.style.color=colorOf(n.cluster);post('brain:hover',{id:n.id,name:n.name,cluster:n.cluster})}
      else if(!selected&&!focusId){rv.textContent='the whole operation';rp.textContent=ALL_LABEL;rp.style.color='var(--amber)'}
    })

      flyTo(n); post('brain:select',{id:n.id,name:n.name,cluster:n.cluster,status:n.status,meta:n.meta}) })
    // hovering an edge brightens+thickens it, lights its two endpoint nodes, and shows a tooltip
    // naming both agents — so you can tell what you're about to click. reapplyLinks() restyles via
    // the accessor fns, so this works for every current AND future edge automatically.
    .onLinkHover(l=>{
      if(l===hoverLink) return

      reapplyLinks()                            // reapplyLinks() also opens the sprite-dirty render window

    })
    .linkLabel(l=>{
      const a=byId.get(l.source.id||l.source), b=byId.get(l.target.id||l.target)
      if(!a||!b) return ''
      const kind=l.kind==='comm'?(l.weight?`${l.weight} message${l.weight===1?'':'s'}`:'messages'):(l.kind==='member'?'member of':'link')
      return `<div style="font-family:'Azeret Mono',monospace;font-size:12px;background:rgba(10,8,6,.94);padding:8px 12px;border-radius:6px;line-height:1.5;border:1px solid rgba(237,228,211,.16)"><div><span style="color:${colorOf(a.cluster)}">${a.name}</span> <span style="color:var(--amber)">⇄</span> <span style="color:${colorOf(b.cluster)}">${b.name}</span></div><div style="opacity:.55;font-size:9px;letter-spacing:.14em;margin-top:3px;text-transform:uppercase">${kind}</div></div>`
    })
    .onLinkClick(l=>{ if(CONSOLE) return   // console: screen-space picker owns edge selection
      const a=l.source.id||l.source,b=l.target.id||l.target
      if(l.kind==='comm'||l.kind==='member'||l.__new) inspectEdge(a,b) })
    .onBackgroundClick(()=>{ if(CONSOLE) return   // console taps rarely hit exact geometry; our screen-space picker owns selection + panels have their own close button
      clearFocus(); panel.classList.remove('on'); msgpanel.classList.remove('on'); Graph.zoomToFit(900,80) })

  // force tuning: strong repulsion + short member springs spread the pillars apart;
  // weak comm springs so cross-cluster edges don't yank everything into a ball.

  Graph.d3Force('link')
    .distance(l=> l.kind==='member' ? 34 : l.kind==='comm' ? 95 : 55)
    .strength(l=> l.kind==='member' ? 0.75 : l.kind==='comm' ? 0.04 : 0.2)

  const c=Graph.controls();c.maxDistance=6000;c.minDistance=10;c.autoRotate=!EMBED;c.autoRotateSpeed=0.35
  window.__controls=c
  // ---- WASDQE free-fly: translate BOTH camera and orbit target together, so click-drag
  // keeps orbiting a point in front of you (not a fixed origin) as you move through space. ----
  const MOVE_KEYS={w:1,a:1,s:1,d:1,q:1,e:1}
  keyState={}
  addEventListener('keydown',ev=>{
    if(document.activeElement===searchEl) return          // don't hijack search typing
    const k=ev.key.toLowerCase()
    if(MOVE_KEYS[k]){ keyState[k]=true; c.autoRotate=false; if(orbiting)setOrbit(false); ev.preventDefault() }
  })
  addEventListener('keyup',ev=>{ const k=ev.key.toLowerCase(); if(MOVE_KEYS[k]) keyState[k]=false })
  addEventListener('blur',()=>{ keyState={} })            // stop moving if window loses focus

  // ---- orbit gating: you can only orbit AROUND a node that's in view, never empty space ----
  const orbitHintEl=document.getElementById('orbit-hint')
  function showOrbitHint(name){
    clearTimeout(showOrbitHint._t)
    if(name){ orbitHintEl.textContent='◉ orbiting '+name; orbitHintEl.className='orbit-hint on ok' }
    else{ orbitHintEl.textContent='✕ no node in view — fly/zoom to a node to orbit'; orbitHintEl.className='orbit-hint on warn' }
    showOrbitHint._t=setTimeout(()=>{ orbitHintEl.className='orbit-hint' },1600)
  }

  function bestInViewNode(){
    const cam=Graph.camera(); const v=new THREE.Vector3()
    let best=null, bestScore=Infinity

      if(n.x==null) continue

      if(v.z>=1) continue                       // behind camera / beyond far plane
      if(Math.abs(v.x)>1||Math.abs(v.y)>1) continue  // off-screen
      const score=v.x*v.x+v.y*v.y               // distance from screen center in NDC
      if(score<bestScore){ bestScore=score; best=n }
    }

  }

    c.autoRotate=false; if(orbiting)setOrbit(false)   // manual drag cancels the auto-orbit
    const n=bestInViewNode()

    }
  },true)

  // ---- CONSOLE finger hitboxes: screen-space tap picker ----
  // 3d-force-graph raycasts against the exact orb/edge geometry — too small for a fingertip. Instead
  // we hit-test in screen space with generous pixel radii and fire the SAME actions (orb → left panel
  // via flyTo; edge → right msgpanel via inspectEdge). Non-invasive: never touches the 3D object model
  // or the digest landmine. A tap = pointerdown+up, small move, short duration (a drag is left to orbit).
  if(CONSOLE){
    const NODE_R=18, EDGE_R=12     // fingertip pick radii in CSS px
    const project=(x,y,z)=>{ const v=new THREE.Vector3(x,y,z).project(Graph.camera())
      if(v.z>=1) return null; const rect=el.getBoundingClientRect()
      return {x:(v.x*0.5+0.5)*rect.width+rect.left, y:(-v.y*0.5+0.5)*rect.height+rect.top} }
    function pickNode(px,py){
      let best=null,bd=NODE_R*NODE_R
      for(const n of DATA.nodes){ if(n.x==null||(n.__obj&&!n.__obj.visible)) continue
        const s=project(n.x,n.y,n.z); if(!s) continue
        const d=(s.x-px)**2+(s.y-py)**2; if(d<bd){bd=d;best=n} }

    }
    function pickEdge(px,py){
      if(!LAYERS.edges) return null
      let best=null,bd=EDGE_R*EDGE_R
      for(const l of DATA.links){ const a=byId.get(l.source.id||l.source), b=byId.get(l.target.id||l.target)
        if(!a||!b||a.x==null||b.x==null) continue
        const pa=project(a.x,a.y,a.z), pb=project(b.x,b.y,b.z); if(!pa||!pb) continue
        // distance from tap to the screen-space segment pa→pb

        const cx=pa.x+t*vx, cy=pa.y+t*vy, d=(cx-px)**2+(cy-py)**2
        if(d<bd){bd=d;best={a:a.id,b:b.id}} }

    }
    let tap=null
    canvas.addEventListener('pointerdown',ev=>{ tap={x:ev.clientX,y:ev.clientY,t:performance.now()} },true)
    canvas.addEventListener('pointerup',ev=>{
      if(!tap) return; const moved=Math.hypot(ev.clientX-tap.x,ev.clientY-tap.y), dur=performance.now()-tap.t; tap=null
      if(moved>14||dur>600) return                 // that was a drag/orbit, not a tap
      const n=pickNode(ev.clientX,ev.clientY)       // orbs win over edges
      if(n){ flyTo(n); post('brain:select',{id:n.id,name:n.name,cluster:n.cluster,status:n.status,meta:n.meta}); return }
      const e=pickEdge(ev.clientX,ev.clientY)

    })
  }

  // Cap the WebGL drawing-buffer resolution on phones (iPhones report DPR 3) — a smaller buffer
  // sharply cuts GPU memory, the main lever against iOS Safari's "problem repeatedly occurred" OOM.
  try{ if(matchMedia('(max-width:640px)').matches) Graph.renderer().setPixelRatio(Math.min(devicePixelRatio||1,1.5)) }catch(e){}
  const key=new THREE.PointLight(0xffeedd,1.5,1200);key.position.set(200,150,100);scene.add(key)
  scene.add(new THREE.AmbientLight(0x403a30,0.7))

  if(BRAIN) loadBrainLobes()   // translucent region lobes (outside the forcegraph digest)

  window.__brain={Graph,DATA,focusOn,clearFocus,pulseLink,get focusId(){return focusId},get pulses(){return activePulses},get scr(){return scr},applySnapshotAt} // debug handle

// ---------- websocket deltas ----------
function connectWS(){
  const proto=location.protocol==='https:'?'wss':'ws'
  const ws=new WebSocket(`${proto}://${location.host}`)
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data)
    if(m.type==='init'){ if(window.__ver&&m.version&&m.version!==window.__ver){location.reload();return} window.__ver=m.version; if(!Graph)init(m.graph); return }
    if(m.type==='reload'){ location.reload(); return }
    if(m.type==='node.flash'){ if(m.kind==='message')return; flashNode(m.id, m.kind==='commit'?1.8:m.kind==='spawn'?2.0:1.2); return }
    if(m.type==='node.update'){ const n=byId.get(m.id); if(n){Object.assign(n,m.patch); if(n.__obj){n.__s=baseScale(n);n.__obj.scale.set(n.__s,n.__s,1)}} return }
    if(m.type==='link.pulse'){ if(scr.live)pulseLink(m.source,m.target,m.kind); return }
    if(m.type==='link.heat'){ if(scr.live){ const l=commFor(m.source,m.target)||ensureCommLink(m.source,m.target); if(l){ l.__heatUntil=m.until; l.__act=Math.max(l.__act||0,0.5); reapplyLinks() } } return }
    if(m.type==='node.add'){
      if(byId.has(m.node.id)) return
      if(BRAIN){
        if(!m.node.brain) return                 // hub/queue/state delta — hidden in brain mode
        applyBrainSwap(m.node)                    // swap onto anatomical anchor + PIN immediately
        DATA.nodes.push(m.node); byId.set(m.node.id,m.node)
        // skip m.link: it targets a brain:null hub absent here → a dangling endpoint throws in d3
        Graph.graphData(DATA); renderLegend(); flashNode(m.node.id,2)
      }else{
        DATA.nodes.push(m.node); byId.set(m.node.id,m.node)
        if(m.link)DATA.links.push(m.link)
        Graph.graphData(DATA); renderLegend(); flashNode(m.node.id,2)
        setTimeout(()=>pinNode(byId.get(m.node.id)),1600)  // pillar mode: pin after the sim reseats it
      }
      return
    }
    if(m.type==='node.remove'){ if(byId.has(m.id)){DATA.nodes=DATA.nodes.filter(n=>n.id!==m.id);DATA.links=DATA.links.filter(l=>(l.source.id||l.source)!==m.id&&(l.target.id||l.target)!==m.id);byId.delete(m.id);Graph.graphData(DATA);renderLegend()} return }
    if(m.type==='ticker'){ if(scr.live)ticker(m.text); return }
    if(m.type==='feed.item'){ if(CONSOLE){ addFeedItem(m.item,true); renderFeed() } return }
  }
  ws.onclose=()=>setTimeout(connectWS,2500)
  ws.onerror=()=>ws.close()
}

// ---------- embed postMessage API ----------
function post(type,payload){ if(EMBED&&window.parent!==window) window.parent.postMessage({type,payload},'*') }
window.addEventListener('message',ev=>{
  const {type,payload}=ev.data||{}
  if(type==='brain:focus'&&payload?.id)flyTo(byId.get(payload.id))
  else if(type==='brain:search'&&payload?.q){searchEl.value=payload.q;doSearch(payload.q)}
  else if(type==='brain:isolate')setSelected(payload?.cluster||null)
  else if(type==='brain:reset'){clearFocus();Graph?.zoomToFit(900,80)}
})

// boot: fetch snapshot then live WS
fetch('/api/graph').then(r=>r.json()).then(d=>{init(d);connectWS()}).catch(()=>connectWS())
</script>
